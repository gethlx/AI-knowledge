name: Publish knowledge atlas

on:
  push:
    branches: [main]
    paths:
      - '02_分析产物/图谱浏览器开发环境/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: 02_分析产物/图谱浏览器开发环境
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 02_分析产物/图谱浏览器开发环境/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build atlas for the repository URL
        run: |
          npm exec vite build -- --config src/ui/vite.config.js --base=/AI-knowledge/
          cp dist-ui/atlas.html dist-ui/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 02_分析产物/图谱浏览器开发环境/dist-ui
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
